<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Pulse</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f7ff;
      --muted: #aab2ca;
      --panel: rgba(18, 24, 46, .78);
      --line: rgba(255, 255, 255, .12);
      --accent: #8b5cf6;
      --accent2: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(139, 92, 246, .3), transparent 28rem),
        radial-gradient(circle at 85% 75%, rgba(34, 211, 238, .2), transparent 25rem),
        #070a15;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    main { width: min(1050px, 100%); }
    header { margin-bottom: 30px; }
    .eyebrow { color: var(--accent2); letter-spacing: .15em; text-transform: uppercase; font-size: 12px; font-weight: 800; }
    h1 { margin: 8px 0; font-size: clamp(42px, 8vw, 78px); line-height: .95; letter-spacing: -.06em; }
    header p { color: var(--muted); max-width: 600px; font-size: 17px; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
    .card {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
    }
    h2 { margin-top: 0; font-size: 18px; }
    label { display: block; color: var(--muted); font-size: 13px; font-weight: 700; margin: 17px 0 7px; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 14px;
      background: rgba(255, 255, 255, .06);
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent2); }
    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      margin-top: 22px;
      color: white;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(120deg, var(--accent), #6366f1, var(--accent2));
    }
    .result { display: grid; place-items: center; min-height: 340px; text-align: center; }
    .score { font-size: 92px; font-weight: 900; line-height: 1; letter-spacing: -.08em; }
    .rating { color: var(--accent2); font-weight: 800; margin-top: 12px; font-size: 20px; }
    .hint { color: var(--muted); max-width: 280px; line-height: 1.5; }
    .error { color: #fca5a5; margin-top: 14px; font-size: 13px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Performance intelligence</div>
      <h1>Dealer Pulse</h1>
      <p>Turn sales, service, and customer sentiment into a clear performance score.</p>
    </header>
    <section class="grid">
      <form class="card" id="form">
        <h2>Evaluate a dealer</h2>
        <label for="name">Dealer name</label>
        <input id="name" value="Northstar Motors" required>
        <label for="sales">Monthly sales</label>
        <input id="sales" type="number" min="0" value="82" required>
        <label for="satisfaction">Customer satisfaction (0–5)</label>
        <input id="satisfaction" type="number" min="0" max="5" step=".1" value="4.6" required>
        <label for="response">Average response time (hours)</label>
        <input id="response" type="number" min="0" value="8" required>
        <button type="submit">Calculate performance</button>
        <div class="error" id="error"></div>
      </form>
      <article class="card result">
        <div id="empty">
          <h2>Ready when you are</h2>
          <p class="hint">Add the latest dealer metrics to generate a weighted performance score.</p>
        </div>
        <div id="answer" hidden>
          <div class="score" id="score"></div>
          <div class="rating" id="rating"></div>
          <p class="hint" id="summary"></p>
        </div>
      </article>
    </section>
  </main>
  <script>
    const form = document.querySelector("#form");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      document.querySelector("#error").textContent = "";
      const payload = {
        name: document.querySelector("#name").value,
        sales: document.querySelector("#sales").value,
        satisfaction: document.querySelector("#satisfaction").value,
        response_time: document.querySelector("#response").value
      };
      const response = await fetch("/api/evaluate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) {
        document.querySelector("#error").textContent = data.error;
        return;
      }
      document.querySelector("#empty").hidden = true;
      document.querySelector("#answer").hidden = false;
      document.querySelector("#score").textContent = data.score;
      document.querySelector("#rating").textContent = data.rating;
      document.querySelector("#summary").textContent =
        `${data.name} scored ${data.score} out of 100 based on its latest performance metrics.`;
    });
  </script>
</body>
</html>
